query PendingReconciliation($bookId: UUID!, $status: String) {
  reconciliationQueues(condition: { bookId: $bookId, status: $status }) {
    nodes {
      rowId
      bookId
      journalEntryId
      source: categorizationSource
      suggestedDebitAccountId
      suggestedCreditAccountId
      status
      reviewedAt
      reviewedBy
      createdAt
      journalEntry {
        rowId
        date
        memo
        source
        isReviewed
      }
    }
    totalCount
  }
}
