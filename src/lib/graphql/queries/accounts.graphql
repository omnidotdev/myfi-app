query AllAccounts($bookId: UUID!) {
  accounts(condition: { bookId: $bookId }) {
    nodes {
      rowId
      bookId
      parentId
      name
      code
      type
      subType
      isPlaceholder
      isActive
      createdAt
      updatedAt
      parent {
        rowId
        name
        code
      }
      children: childAccounts {
        nodes {
          rowId
          name
          code
          type
        }
      }
    }
  }
}
